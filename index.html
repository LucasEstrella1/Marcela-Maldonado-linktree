<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIP Marcela Maldonado 💎🔥</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('file:///C:/Users/Lucas%20Estrella/Desktop/HOT/Marcela%20Maldonado/Conte%C3%BAdo%20original/Fotos/Editadas/100-pintando,%20n%20aparece%20nada.jpg') no-repeat center center/cover;
      backdrop-filter: blur(8px);
      color: #fff;
      text-align: center;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px;
    }

    .photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: url('file:///C:/Users/Lucas%20Estrella/Desktop/HOT/Marcela%20Maldonado/Conte%C3%BAdo%20original/Fotos/Editadas/016-selfie%20lingerie,%20n%20mostra%20nada.jpeg') no-repeat center center/cover;
      border: 3px solid #fff;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.6em;
      font-weight: 600;
    }

    h2 {
      font-size: 1em;
      font-weight: 400;
      color: #ccc;
    }

    p {
      font-size: 0.9em;
      color: #ddd;
      margin-top: 5px;
      max-width: 320px;
    }

    small {
      font-size: 0.75em;
      color: #ff3b3b;
      margin-bottom: 15px;
      display: block;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 80%;
      max-width: 300px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 30px;
      font-weight: 600;
      text-decoration: none;
      font-size: 1em;
      transition: 0.3s;
      animation: pulse 2s infinite ease-in-out;
    }

    .btn-telegram {
      background-color: #0088cc;
      color: #fff;
    }

    .btn-telegram:hover {
      background-color: #0077b5;
    }

    .btn-privacy {
      background-color: #fff;
      color: #000;
    }

    .btn-privacy:hover {
      background-color: #f0f0f0;
    }

    .btn span {
      font-size: 1.2em;
    }

    /* Animação de pulsação suave */
    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 rgba(255,255,255,0);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(255,255,255,0.3);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 rgba(255,255,255,0);
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <div class="photo"></div>
    <h1>VIP Marcela Maldonado 💎🔥</h1>
    <h2>@amar.maldonado1</h2>
    <p>🔥 Clique no botão e aproveite as minhas mídias mais quentes 🔥</p>
    <small>Você não imagina o que está perdendo. 🤭 Assine o VIP para ficar por dentro de tudo! 🙈</small>

    <div class="buttons">
      <a href="#" class="btn btn-telegram">
        <span>💬</span> Meu grupo VIP 💎
      </a>
      <a href="#" class="btn btn-privacy">
        <span>🔥</span> Privacy 🔒
      </a>
    </div>
  </div>
</body>
</html>
